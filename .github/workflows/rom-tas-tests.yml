name: Local ROM TAS smoke test

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game build to test
        required: true
        type: choice
        options: [black, white]
      checkpoint:
        description: Gym entry (generated save) or a leader battle (local savestate)
        required: true
        type: choice
        options: [gym-entry, cilan, chili, cress]

permissions:
  contents: read

jobs:
  tas-smoke-test:
    if: github.repository == 'Thoyt83/pokemon-black-white-hack' && github.ref == 'refs/heads/main' && github.actor == 'Thoyt83'
    runs-on: [self-hosted, Windows, X64, rom-test]
    timeout-minutes: 10
    steps:
      - name: Check out main-branch source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ROM build dependency
        run: python -m pip install -r requirements.txt
      - name: Build and run TAS smoke test
        shell: powershell
        env:
          GAME: ${{ inputs.game }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: .\scripts\run_rom_tas_tests.ps1 -Game $env:GAME -Checkpoint $env:CHECKPOINT
      - name: Upload gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tas-${{ inputs.game }}-${{ inputs.checkpoint }}-${{ github.run_id }}
          path: build/rom-test/${{ inputs.game }}-${{ inputs.checkpoint }}/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove generated ROMs and test outputs
        if: always()
        shell: powershell
        run: |
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relative in @('build\striaton', 'build\rom-test')) {
            $target = [System.IO.Path]::GetFullPath((Join-Path $workspace $relative))
            if (-not $target.StartsWith($workspace + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to clean path outside the workspace: $target"
            }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
