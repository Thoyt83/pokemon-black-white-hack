name: ROM-free project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install report renderer
        run: python -m pip install -r requirements-ci.txt
      - name: Prepare evidence directory
        run: mkdir -p build/ci
      - name: Validate battle proposals
        run: python -m unittest discover -s tests -v 2>&1 | tee build/ci/test-results.txt
      - name: Render visual team report
        run: python scripts/render_ci_report.py --output build/ci/team-report.png
      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: design-test-evidence
          path: build/ci/
          if-no-files-found: error
          retention-days: 30
